<section class="sect-m s-steps" id="s-steps">
  <div class="container">
    <div class="sect-head">
      <h2 class="s-title">Как получить кредит</h2>
    </div>
    <div class="s-steps__grid">
      <div class="s-steps__item">
        <div class="t-title item-title">Отправьте заявку</div>
        <div class="item-body">
          <p class="item-content">
            Заполните форму и отправьте её в дилерский центр
          </p>
          <a
            href="#modal-feedback"
            data-fancybox
            data-modal-title="Оформить кредит"
            data-btn-note="Оформить кредит"
            data-target-note="#modal-feedback .input-note"
            class="btn-s item-btn"
          >
            Оформить кредит
          </a>
        </div>
        <div class="item-num">1</div>
      </div>
      <div class="s-steps__item">
        <div class="t-title item-title">Получите одобрение</div>
        <div class="item-body">
          <p class="item-content">
            Вы можете отправить заявку через дилерский центр лично или удаленно
          </p>
          <div class="item-num">2</div>
        </div>
      </div>
      <div class="s-steps__item">
        <div class="t-title item-title">Оформите документы</div>
        <div class="item-body">
          <p class="item-content">
            Подпишите кредитный договор и договор купли-продажи
          </p>
          <div class="item-num">3</div>
        </div>
      </div>
    </div>
  </div>
</section>
