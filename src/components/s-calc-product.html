<section class="s-calc" id="s-calc">
  <div class="container">
    <div class="s-calc__wrap">
      <div class="s-calc__info">
        <div class="sect-head">
          <h2 class="s-title">Расчет стоимости кредита</h2>
          <div class="content-box sect-head__content">
            <p>
              Специальные программы покупки в кредит.
              <br />
              Сниженные процентные ставки при поддержке производителя
            </p>
          </div>
        </div>
        <div data-cars-options="Значение 1, Значение 2, Значение 3">
          <form action="#" class="s-calc__form">
            <div class="form-grid">
              <div class="form-control">
                <input type="text" placeholder="Имя" class="input" />
              </div>
              <div class="form-control">
                <input type="tel" placeholder="Телефон" class="input" />
              </div>
              <div class="form-control">
                <input type="text" placeholder="Срок кредита" class="input" />
              </div>
              <div class="form-control">
                <input
                  type="text"
                  placeholder="Первоначальный взнос"
                  class="input"
                />
              </div>
              <div class="form-control _full">
                <div class="check-wrap">
                  <span
                    class="wpcf7-form-control-wrap"
                    data-name="acceptance-297"
                  >
                    <span class="wpcf7-form-control wpcf7-acceptance">
                      <span class="wpcf7-list-item">
                        <label>
                          <input
                            type="checkbox"
                            name="acceptance-297"
                            value="1"
                            aria-invalid="false"
                          />
                          <span class="wpcf7-list-item-label">
                            <span>
                              Я соглашаюсь с
                              <a href="/personal-data">
                                Правилами обработки персональных данных
                              </a>
                              и
                              <a href="/privacy-policy">
                                Политикой конфиденциальности
                              </a>
                            </span>
                          </span>
                        </label>
                      </span>
                    </span>
                  </span>
                </div>
                <button type="submit" class="btn-s">Отправить</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="s-calc__gallery">
        <img src="@img/calc.jpg" alt="image" class="s-calc__img" />
      </div>
    </div>
  </div>
</section>
