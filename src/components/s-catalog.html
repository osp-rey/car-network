<section class="sect-p s-catalog bg-porcelain" id="s-catalog">
  <div class="container">
    <div class="s-catalog__wrap">
      <aside class="s-catalog__sidebar">
        <div class="s-catalog__sidebar-head">
          <div class="s-catalog__sidebar-title">Найдите свой автомобиль</div>
        </div>
        <div class="s-catalog__sidebar-filters">
          <div
            class="berocket_single_filter_widget berocket_single_filter_widget_121 bapf_wid_"
          >
            <div
              class="bapf_sfilter bapf_slidr bapf_slidr_jqrui bapf_slidr_ready"
            >
              <div class="bapf_head"><h3>Цена</h3></div>
              <div class="bapf_body">
                <div class="bapf_slidr_all">
                  <span class="bapf_from">
                    <span class="bapf_tbprice">₽</span>
                    <input type="text" placeholder="6000" />
                  </span>
                  <span class="bapf_to">
                    <span class="bapf_tbprice">₽</span>
                    <input type="text" placeholder="6000" />
                  </span>
                  <div
                    class="bapf_slidr_main bapf_slidr_num ui-slider ui-corner-all ui-slider-horizontal ui-widget ui-widget-content"
                    data-display="wc_price"
                  >
                    <div
                      class="ui-slider-range ui-corner-all ui-widget-header"
                      style="left: 0%; width: 100%"
                    ></div>
                    <span
                      tabindex="0"
                      class="ui-slider-handle ui-corner-all ui-state-default"
                      style="left: 0%"
                    ></span>
                    <span
                      tabindex="0"
                      class="ui-slider-handle ui-corner-all ui-state-default"
                      style="left: 100%"
                    ></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>
      <div class="s-catalog__body">
        <div class="s-catalog__head">
          <div class="s-title s-catalog__count">27 авто в наличии</div>
          <div class="s-catalog__sort-wrap">
            <form class="woocommerce-ordering">
              <select name="orderby" class="orderby">
                <option value="menu_order" selected="selected">
                  По популярности
                </option>
                <option value="popularity">По возрастанию цены</option>
                <option value="rating">По убыванию цены</option>
              </select>
              <input type="hidden" name="paged" value="1" />
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
