<header class="header _fixed">
  <div class="container">
    <div class="header__wrap">
      <div class="header__logos">
        <a href="/" class="header__logo">
          <img src="@img/logo-dark.svg" alt="logo" class="logo-dark" />
          <img src="@img/logo-white.svg" alt="logo" class="logo-white" />
        </a>
        <div class="header__logo-all">
          <img src="@img/logo-all-dark.svg" alt="logo" class="logo-dark" />
          <img src="@img/logo-all-white.svg" alt="logo" class="logo-white" />
        </div>
      </div>
      <nav class="header__nav">
        <ul class="list header__list">
          <li><a href="/#s-models">Каталог</a></li>
          <li><a href="/#s-promo">Акции</a></li>
          <li><a href="/#s-about">О компании</a></li>
          <li><a href="/#s-news">Новости</a></li>
          <li><a href="/#s-contacts">Контакты</a></li>
        </ul>
      </nav>
      <div class="header__contacts">
        <div class="header__contacts-info">
          <a href="tel:+79999999999" class="header__tel">+7 (999) 999-99-99</a>
          <div class="header__address">
            <i class="icon-location"></i>
            <span>г. Казань, Ямашева д. 1</span>
          </div>
        </div>
        <a
          href="#modal-feedback"
          data-fancybox
          data-modal-title="Записаться на тест-драйв"
          data-btn-note="Записаться на тест-драйв"
          data-targt-note="#modal-feedback .input-note"
          class="btn-s header__btn"
        >
          Записаться на тест-драйв
        </a>
      </div>
      <div class="header__mob-buttons">
        <a href="tel:+79999999999" target="_blank" class="header__mob-btn">
          <i class="icon-tel"></i>
        </a>
        <div
          target="_blank"
          rel="nofollow"
          class="header__mob-btn"
          id="burger-open"
        >
          <i class="icon-burger"></i>
        </div>
      </div>
    </div>
  </div>
</header>
