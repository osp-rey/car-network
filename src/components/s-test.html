<section class="sect-p s-test" id="s-test">
  <div class="container">
    <div class="s-test__wrap">
      <div class="sect-head">
        <h2 class="s-title">
          Запишитесь
          <br />
          на тест-драйв
        </h2>
        <div class="content-box s-test__content sect-head__content">
          <p>
            Запишитесь на пробную поездку
            <br />
            и получите индивидуальное предложение
          </p>
        </div>
      </div>
      <div data-cars-options="Значение 1, Значение 2">
        <form action="#" class="s-test__form">
          <div class="form-grid">
            <div class="form-control _full">
              <input
                type="text"
                placeholder="Укажите ваш номер телефона"
                class="input"
              />
            </div>
            <div class="form-control">
              <div class="select" data-target-options="cars">
                <div class="select-btn">
                  <input
                    type="text"
                    placeholder="Укажите модель"
                    readonly
                    class="input select-input"
                  />
                  <i class="icon-bottom select-arrow"></i>
                </div>
                <div class="select-body"></div>
              </div>
            </div>
            <div class="form-control">
              <input
                type="text"
                placeholder="Выберите удобную дату"
                class="input"
              />
            </div>
            <div class="form-control _full">
              <div class="check-wrap">
                <span class="wpcf7-form-control-wrap" data-name="acceptance-297">
                  <span class="wpcf7-form-control wpcf7-acceptance">
                    <span class="wpcf7-list-item">
                      <label>
                        <input
                          type="checkbox"
                          name="acceptance-297"
                          value="1"
                          aria-invalid="false"
                        />
                        <span class="wpcf7-list-item-label">
                          <span>
                            Я соглашаюсь с
                            <a href="/personal-data">
                              Правилами обработки персональных данных
                            </a>
                            и
                            <a href="/privacy-policy">
                              Политикой конфиденциальности
                            </a>
                          </span>
                        </span>
                      </label>
                    </span>
                  </span>
                </span>
              </div>
              <button type="submit" class="btn-s">Отправить</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <picture class="sect-bg s-test__bg">
    <img src="@img/test.jpg" alt="background" />
  </picture>
</section>
